# render.yaml — Render Blueprint for Inter-Agent Trust Verifier
# Deploy: Connect this repo to Render and it auto-detects this file.

services:
  # ─── FastAPI Backend ──────────────────────────────────
  - type: web
    name: trust-verifier-api
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./trust_verifier.db
      - key: SECRET_KEY
        generateValue: true
      - key: LOG_LEVEL
        value: INFO
      - key: OPENAI_API_KEY
        value: ""
      - key: PYTHON_VERSION
        value: "3.11.0"

  # ─── React Dashboard (Static Site) ──────────────────
  - type: web
    name: trust-verifier-dashboard
    runtime: static
    region: oregon
    plan: free
    buildCommand: cd dashboard && npm install && npm run build
    staticPublishPath: dashboard/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "20"
