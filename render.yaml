services:

  # ─── FastAPI Backend ────────────────────────────────
  - type: web
    name: trust-verifier-api
    runtime: docker
    plan: free

    dockerfilePath: ./Dockerfile
    dockerContext: .

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: trust-verifier-db
          property: connectionString

      - key: SECRET_KEY
        generateValue: true

      - key: LOG_LEVEL
        value: INFO


  # ─── React Dashboard ────────────────────────────────
  - type: web
    name: trust-verifier-dashboard
    runtime: static

    buildCommand: cd dashboard && npm install && npm run build
    staticPublishPath: dashboard/dist

    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:

  # ─── PostgreSQL Database ────────────────────────────
  - name: trust-verifier-db
    plan: free
